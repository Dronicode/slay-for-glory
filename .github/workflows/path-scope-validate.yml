name: Path Scope Validation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Report Paths and Scopes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Analyze changed paths and commit scopes
        id: analyze
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          COMMIT_SUBJECTS="$(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")"

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo
          echo "Commit subjects:"
          echo "$COMMIT_SUBJECTS"
          echo

          has_content_changes=false
          has_rules_changes=false
          has_cards_changes=false
          has_site_changes=false
          has_ci_changes=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            # Site infrastructure map to site scope.
            if [[ "$file" == docs/assets/* ]] || [[ "$file" == docs/stylesheets/* ]] || [[ "$file" == docs/javascripts/* ]] || [[ "$file" == zensical.toml ]]; then
              has_site_changes=true
              continue
            fi

            # Automation files map to the ci scope.
            if [[ "$file" == .github/* ]] || [[ "$file" == scripts/* ]] || [[ "$file" == .releaserc.*.cjs ]] || [[ "$file" == .commitlintrc.js ]] || [[ "$file" == .gitignore ]]; then
              has_ci_changes=true
              continue
            fi

            # Cards files map to the cards scope.
            if [[ "$file" == docs/cards/* ]]; then
              has_cards_changes=true
              continue
            fi

            # Rules files map to the rules scope.
            if [[ "$file" == docs/rules/* ]]; then
              has_rules_changes=true
              continue
            fi

            # Other docs files map to content scope.
            if [[ "$file" == docs/* ]]; then
              has_content_changes=true
              continue
            fi

          done <<< "$CHANGED_FILES"

          content_scope_count=$(echo "$COMMIT_SUBJECTS" | grep -Ei -c '^[a-z]+\(content\)!?: ' || true)
          rules_scope_count=$(echo "$COMMIT_SUBJECTS" | grep -Ei -c '^[a-z]+\(rules\)!?: ' || true)
          cards_scope_count=$(echo "$COMMIT_SUBJECTS" | grep -Ei -c '^[a-z]+\(cards\)!?: ' || true)
          site_scope_count=$(echo "$COMMIT_SUBJECTS" | grep -Ei -c '^[a-z]+\(site\)!?: ' || true)
          ci_scope_count=$(echo "$COMMIT_SUBJECTS" | grep -Ei -c '^[a-z]+\(ci\)!?: ' || true)

          content_scoped_commit_count=$((content_scope_count + rules_scope_count + cards_scope_count))
          infra_scoped_commit_count=$((site_scope_count + ci_scope_count))

          content_release_count=$(echo "$COMMIT_SUBJECTS" | grep -Ei -c '^(feat|fix)\((content|rules|cards)\)!?: ' || true)
          infra_release_count=$(echo "$COMMIT_SUBJECTS" | grep -Ei -c '^(feat|fix)\((ci|site)\)!?: ' || true)

          content_release_eligible=false
          infra_release_eligible=false
          if [ "$content_release_count" -gt 0 ]; then
            content_release_eligible=true
          fi
          if [ "$infra_release_count" -gt 0 ]; then
            infra_release_eligible=true
          fi

          mismatch_count=0
          mismatch_lines=""

          commit_scope_checked_total=0
          commit_scope_good=0
          commit_scope_bad=0
          commit_scope_mismatch_lines=""
          commit_scope_recommendation_lines=""

          add_mismatch() {
            local message="$1"
            mismatch_count=$((mismatch_count + 1))
            mismatch_lines+="- ${message}"$'\n'
          }

          add_commit_scope_bad() {
            local mismatch_message="$1"
            local recommendation_message="$2"
            commit_scope_bad=$((commit_scope_bad + 1))
            commit_scope_mismatch_lines+="- ${mismatch_message}"$'\n'
            commit_scope_recommendation_lines+="- ${recommendation_message}"$'\n'
          }

          if [ "$has_content_changes" = true ] && [ "$content_scope_count" -eq 0 ]; then
            add_mismatch "Content docs changed but no commits used (content) scope."
          fi
          if [ "$has_rules_changes" = true ] && [ "$rules_scope_count" -eq 0 ]; then
            add_mismatch "Rules docs changed but no commits used (rules) scope."
          fi
          if [ "$has_cards_changes" = true ] && [ "$cards_scope_count" -eq 0 ]; then
            add_mismatch "Cards docs changed but no commits used (cards) scope."
          fi
          if [ "$has_site_changes" = true ] && [ "$site_scope_count" -eq 0 ]; then
            add_mismatch "Site files changed but no commits used (site) scope."
          fi
          if [ "$has_ci_changes" = true ] && [ "$ci_scope_count" -eq 0 ]; then
            add_mismatch "Automation files changed but no commits used (ci) scope."
          fi

          if [ "$has_content_changes" = false ] && [ "$content_scope_count" -gt 0 ]; then
            add_mismatch "Found (content) commits but no content docs files changed."
          fi
          if [ "$has_rules_changes" = false ] && [ "$rules_scope_count" -gt 0 ]; then
            add_mismatch "Found (rules) commits but no rules docs files changed."
          fi
          if [ "$has_cards_changes" = false ] && [ "$cards_scope_count" -gt 0 ]; then
            add_mismatch "Found (cards) commits but no cards docs files changed."
          fi
          if [ "$has_site_changes" = false ] && [ "$site_scope_count" -gt 0 ]; then
            add_mismatch "Found (site) commits but no site files changed."
          fi
          if [ "$has_ci_changes" = false ] && [ "$ci_scope_count" -gt 0 ]; then
            add_mismatch "Found (ci) commits but no automation files changed."
          fi

          append_expected_scope() {
            local scope="$1"
            case ",$expected_scopes_csv," in
              *",${scope},"*) ;;
              *)
                if [ -z "$expected_scopes_csv" ]; then
                  expected_scopes_csv="$scope"
                else
                  expected_scopes_csv="${expected_scopes_csv},${scope}"
                fi
                ;;
            esac
          }

          COMMIT_SHAS="$(git log --no-merges --format=%H "$BASE_SHA..$HEAD_SHA")"

          while IFS= read -r commit_sha; do
            [ -z "$commit_sha" ] && continue

            commit_subject="$(git log -1 --format=%s "$commit_sha")"
            commit_scope="$(echo "$commit_subject" | sed -nE 's/^[a-zA-Z]+\(([^)]+)\)!?: .*/\1/p' | tr '[:upper:]' '[:lower:]')"

            # Only score scope/path matching for scoped commits.
            [ -z "$commit_scope" ] && continue

            commit_scope_checked_total=$((commit_scope_checked_total + 1))
            expected_scopes_csv=""

            commit_files="$(git diff-tree --no-commit-id --name-only -r "$commit_sha")"

            while IFS= read -r file; do
              [ -z "$file" ] && continue

              if [[ "$file" == docs/assets/* ]] || [[ "$file" == docs/stylesheets/* ]] || [[ "$file" == docs/javascripts/* ]] || [[ "$file" == zensical.toml ]]; then
                append_expected_scope "site"
                continue
              fi

              if [[ "$file" == .github/* ]] || [[ "$file" == scripts/* ]] || [[ "$file" == .releaserc.*.cjs ]] || [[ "$file" == .commitlintrc.js ]] || [[ "$file" == .gitignore ]]; then
                append_expected_scope "ci"
                continue
              fi

              if [[ "$file" == docs/cards/* ]]; then
                append_expected_scope "cards"
                continue
              fi

              if [[ "$file" == docs/rules/* ]]; then
                append_expected_scope "rules"
                continue
              fi

              if [[ "$file" == docs/* ]]; then
                append_expected_scope "content"
                continue
              fi

            done <<< "$commit_files"

            if [ -z "$expected_scopes_csv" ]; then
              add_commit_scope_bad \
                "${commit_subject} -> scope (${commit_scope}) does not map to changed paths." \
                "Use an unscoped commit or a non-release scope for these paths."
              continue
            fi

            case ",$expected_scopes_csv," in
              *",${commit_scope},"*)
                commit_scope_good=$((commit_scope_good + 1))
                ;;
              *)
                add_commit_scope_bad \
                  "${commit_subject} -> scope (${commit_scope}) does not match changed paths." \
                  "Suggested scope(s): (${expected_scopes_csv})."
                ;;
            esac
          done <<< "$COMMIT_SHAS"

          total_commit_count=$(echo "$COMMIT_SUBJECTS" | sed '/^\s*$/d' | wc -l | tr -d ' ')
          scoped_commit_count=$(echo "$COMMIT_SUBJECTS" | grep -Ei -c '^[a-z]+\([^)]+\)!?: ' || true)
          unscoped_commit_count=$((total_commit_count - scoped_commit_count))

          if [ "$mismatch_count" -eq 0 ]; then
            mismatch_block="None detected."
          else
            mismatch_block="$mismatch_lines"
          fi

          if [ "$commit_scope_bad" -eq 0 ] && [ "$mismatch_count" -eq 0 ]; then
            commit_scope_status="All scoped commits match expected path scopes."
            detail_mismatch_section=""
            detail_recommendation_section=""
          else
            commit_scope_status=""

            merged_mismatch_lines=""
            if [ -n "$commit_scope_mismatch_lines" ]; then
              merged_mismatch_lines+="$commit_scope_mismatch_lines"
            fi
            if [ -n "$mismatch_lines" ]; then
              merged_mismatch_lines+="$mismatch_lines"
            fi

            if [ -z "$merged_mismatch_lines" ]; then
              merged_mismatch_lines="- None."
            fi

            if [ -n "$commit_scope_recommendation_lines" ]; then
              recommendation_lines="$commit_scope_recommendation_lines"
            else
              recommendation_lines="- Suggested release scopes by path family: content, rules, cards, ci, site."
            fi

            detail_mismatch_section=$'\n### Path/Scope Mismatches\n'
            detail_mismatch_section+="$merged_mismatch_lines"

            detail_recommendation_section=$'\n### Path/Scope Recommendations\n'
            detail_recommendation_section+="$recommendation_lines"
          fi

          summary_file="$(mktemp)"
          {
            echo "<!-- path-scope-advisory-comment -->"
            echo "## Report Paths and Scopes"
            echo
            echo "- Content release commits in this PR: **${content_release_count}**"
            echo "- Infra release commits in this PR: **${infra_release_count}**"
            echo "- Unscoped commits in this PR: **${unscoped_commit_count}**"
            echo
            echo "- ✅ Scope/path matches: **${commit_scope_good}/${commit_scope_checked_total}**"
            echo "- ❌ Scope/path mismatches: **${commit_scope_bad}/${commit_scope_checked_total}**"
            echo
            echo "$commit_scope_status"
            printf '%b\n' "$detail_mismatch_section"
            printf '%b\n' "$detail_recommendation_section"
          } > "$summary_file"

          {
            echo "content_release_eligible=$content_release_eligible"
            echo "infra_release_eligible=$infra_release_eligible"
            echo "content_scoped_commit_count=$content_scoped_commit_count"
            echo "infra_scoped_commit_count=$infra_scoped_commit_count"
            echo "unscoped_commit_count=$unscoped_commit_count"
            echo "commit_scope_good=$commit_scope_good"
            echo "commit_scope_bad=$commit_scope_bad"
            echo "commit_scope_checked_total=$commit_scope_checked_total"
            echo "summary<<EOF"
            cat "$summary_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

          echo "Path/scope validation is advisory only."
          echo "This check reports mismatches but does not block the PR."

      - name: Upsert advisory PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const marker = "<!-- path-scope-advisory-comment -->";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const body = process.env.ADVISORY_BODY;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              }
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
        env:
          ADVISORY_BODY: ${{ steps.analyze.outputs.summary }}
