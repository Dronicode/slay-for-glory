name: Semantic Release

on:
  # Run releases from protected production history.
  push:
    branches:
      - main
  # Manual trigger for maintenance, debugging, or forced re-runs.
  workflow_dispatch:

# Allow tag, changelog, and release writes.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  detect-changes:
    name: Detect Change Scopes
    runs-on: ubuntu-latest
    outputs:
      # Skip bot-generated release commits.
      generated_commit: ${{ steps.detect.outputs.generated_commit }}
      # True when commits include content scopes.
      content_changed: ${{ steps.detect.outputs.content_changed }}
      # True when commits include infra scopes.
      infra_changed: ${{ steps.detect.outputs.infra_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history is required for range detection.
          fetch-depth: 0

      - name: Detect commit scopes in push range
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # Skip generated release commits.
          GENERATED_COMMIT=false
          HEAD_MSG="${{ github.event.head_commit.message || '' }}"
          if echo "$HEAD_MSG" | grep -Eq '^chore\((release|tag|infra)\):'; then
            GENERATED_COMMIT=true
          fi

          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"

          # Fall back to the parent commit when GitHub does not provide a usable base SHA.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse "$SHA^")"
          fi

          # Inspect commit subjects only.
          SUBJECTS="$(git log --format=%s "$BEFORE..$SHA")"

          CONTENT_CHANGED=false
          INFRA_CHANGED=false

          # Content version track: release triggered by feat/fix in content, rules, or cards scopes.
          if echo "$SUBJECTS" | grep -Eq '^(feat|fix)\((content|rules|cards)\)!?: '; then
            CONTENT_CHANGED=true
          fi

          # Infra version track: release triggered by feat/fix in ci or site scopes.
          if echo "$SUBJECTS" | grep -Eq '^(feat|fix)\((ci|site)\)!?: '; then
            INFRA_CHANGED=true
          fi

          # Export booleans for downstream jobs.
          {
            echo "generated_commit=$GENERATED_COMMIT"
            echo "content_changed=$CONTENT_CHANGED"
            echo "infra_changed=$INFRA_CHANGED"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Publish Release
    needs: detect-changes
    # Run when either release track has qualifying changes, never for bot-generated release commits.
    if: >-
      needs.detect-changes.outputs.generated_commit == 'false' &&
      (needs.detect-changes.outputs.content_changed == 'true' ||
       needs.detect-changes.outputs.infra_changed == 'true')
    runs-on: ubuntu-latest
    outputs:
      # Used to deploy only after a content release.
      released: ${{ steps.content-release.outputs.released }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure bot git identity
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BOT_NAME="${{ steps.app-token.outputs.app-slug }}[bot]"
          BOT_USER_ID="$(gh api "/users/${BOT_NAME}" --jq .id)"
          BOT_EMAIL="${BOT_USER_ID}+${BOT_NAME}@users.noreply.github.com"

          {
            echo "GIT_AUTHOR_NAME=$BOT_NAME"
            echo "GIT_AUTHOR_EMAIL=$BOT_EMAIL"
            echo "GIT_COMMITTER_NAME=$BOT_NAME"
            echo "GIT_COMMITTER_EMAIL=$BOT_EMAIL"
          } >> "$GITHUB_ENV"

          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install semantic-release dependencies
        run: |
          npm install --no-save \
            semantic-release@25.0.5 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/release-notes-generator@14.1.1 \
            @semantic-release/changelog@6.0.3 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/git@10.0.1 \
            @semantic-release/github@10.2.1 \
            conventional-changelog-conventionalcommits@10.2.1

      - name: Run content semantic-release
        id: content-release
        if: needs.detect-changes.outputs.content_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          npx semantic-release --extends ./.releaserc.content.cjs 2>&1 | tee semantic-release-content.log

          # Report whether a GitHub release was created.
          if grep -q "Published GitHub release:" semantic-release-content.log; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run infra semantic-release
        if: needs.detect-changes.outputs.infra_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          npx semantic-release --extends ./.releaserc.infra.cjs

  deploy-site:
    name: Deploy Site
    needs: release
    # Deploy only after a content release.
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment

  sync-develop:
    name: Sync Develop from Main
    needs: [detect-changes, release]
    # Skip generated commits and sync after a successful or skipped release job.
    if: >-
      always() &&
      needs.detect-changes.outputs.generated_commit == 'false' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BOT_NAME="${{ steps.app-token.outputs.app-slug }}[bot]"
          BOT_USER_ID="$(gh api "/users/${BOT_NAME}" --jq .id)"
          BOT_EMAIL="${BOT_USER_ID}+${BOT_NAME}@users.noreply.github.com"

          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"

      - name: Sync develop with main
        run: |
          git fetch origin main develop
          git checkout develop
          git merge --ff-only origin/main
          git push origin develop
